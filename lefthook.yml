pre-commit:
  parallel: true
  jobs:
    # html is in the list because index.html carries the page's whole head —
    # description, preview tags, canonical URL — and a syntax error in an
    # attribute there is invisible to the tests, which parse leniently.
    - name: format
      glob: '*.{ts,tsx,js,jsx,css,json,md,html}'
      run: npx prettier --write {staged_files}
      stage_fixed: true

    - name: lint
      glob: '*.{ts,tsx,js,jsx}'
      run: npx eslint --max-warnings 0 {staged_files}

    - name: typecheck
      glob: '*.{ts,tsx}'
      run: npm run typecheck

pre-push:
  jobs:
    - name: unit-and-integration-tests
      run: npm run test -- --run

commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}
