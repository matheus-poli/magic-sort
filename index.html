<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Magic Sort</title>
    <meta
      name="description"
      content="A liquid-sorting puzzle set in a medieval alchemist's atelier: pour mixed elixirs between glass flasks until each one holds a single pure colour."
    />

    <!-- The same build answers on three hostnames — the custom domain with and
         without www, and the GitHub Pages origin behind it. This names one of
         them as the original wherever the page is found. -->
    <link rel="canonical" href="https://matpoli.dev/magic-sort/" />
    <meta name="theme-color" content="#0a0616" />

    <!-- A chat client builds its preview from these and never runs the script
         below, so the URLs have to be absolute: a relative one is dropped
         without a word, and the link arrives bare. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mat Poli" />
    <meta property="og:title" content="Magic Sort" />
    <meta
      property="og:description"
      content="A liquid-sorting puzzle set in a medieval alchemist's atelier: pour mixed elixirs between glass flasks until each one holds a single pure colour."
    />
    <meta property="og:url" content="https://matpoli.dev/magic-sort/" />
    <meta
      property="og:image"
      content="https://matpoli.dev/magic-sort/social-card.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Magic Sort atelier: the Mat Poli wordmark in one corner and a colour-blind mode switch in the other, the game's title above the line Level 1 of 10, a score of 0 out of 1000 beside a total of 0 out of 10000, and six glass flasks on a bench — four layered with amber, azure, crimson and green elixir, two still empty."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Magic Sort" />
    <meta
      name="twitter:description"
      content="A liquid-sorting puzzle set in a medieval alchemist's atelier: pour mixed elixirs between glass flasks until each one holds a single pure colour."
    />
    <meta
      name="twitter:image"
      content="https://matpoli.dev/magic-sort/social-card.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="The Magic Sort atelier: the Mat Poli wordmark in one corner and a colour-blind mode switch in the other, the game's title above the line Level 1 of 10, a score of 0 out of 1000 beside a total of 0 out of 10000, and six glass flasks on a bench — four layered with amber, azure, crimson and green elixir, two still empty."
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>
        Magic Sort is a liquid-sorting puzzle set in a medieval alchemist's
        atelier. An apprentice pours mixed elixirs between glass flasks until
        each one holds a single pure colour: a pour is legal when the target
        flask is empty, or its top layer matches what is being poured, and it
        has room to take it. Playing it needs JavaScript, which this browser has
        turned off.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
