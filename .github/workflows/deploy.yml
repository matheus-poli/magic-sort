# Publishes the game to GitHub Pages on every push to main.
#
# The quality gate runs first and the deploy depends on it, so nothing reaches
# the public URL that has not passed typecheck, lint, format, the unit and
# integration suites and the browser smoke test.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The published site is one shared resource, so runs queue instead of racing.
# Cancelling halfway could leave Pages serving a partly published build.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # mise reads the Node version out of mise.toml, so CI runs the same
      # toolchain a contributor does, from the same single source of truth.
      - uses: jdx/mise-action@v4

      - run: npm ci
      - run: npm run verify

      # --with-deps because the runner lacks the system libraries the browser
      # needs; the browser build itself is pinned by the Playwright version.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    name: Deploy
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
